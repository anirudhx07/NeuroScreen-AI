apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroscreen-ml
  namespace: neuroscreen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neuroscreen-ml
  template:
    metadata:
      labels:
        app: neuroscreen-ml
    spec:
      containers:
      - name: ml-backend
        image: neuroscreen-ml:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ml-backend-secrets
              key: database-url
        - name: FIREBASE_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: ml-backend-secrets
              key: firebase-credentials
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: neuroscreen-ml-service
  namespace: neuroscreen
spec:
  selector:
    app: neuroscreen-ml
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuroscreen-ml-hpa
  namespace: neuroscreen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuroscreen-ml
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroscreen-ml-config
  namespace: neuroscreen
data:
  LOG_LEVEL: "INFO"
  BATCH_SIZE: "32"
  MAX_WORKERS: "4"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuroscreen-ml-pdb
  namespace: neuroscreen
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neuroscreen-ml
